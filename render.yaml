services:
  - type: web
    name: bon-server
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://bonshop.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: API_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
