<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BON ADMIN</title><link rel="stylesheet" href="/style.css"></head><body>
<main>
<section id="login" class="card"><h2>🔐 BON ADMIN</h2><input id="email" type="email" placeholder="Admin Email"><input id="pass" type="password" placeholder="Admin Password"><button onclick="login()">ĐĂNG NHẬP</button><pre id="msg"></pre></section>
<section id="panel" class="hide"><div class="card"><h2>⚙️ Admin Control</h2><button onclick="logout()">ĐĂNG XUẤT</button></div>
<div class="grid">
<div class="card"><h3>👥 Người dùng</h3><button onclick="users()">TẢI</button><pre id="usersOut"></pre></div>
<div class="card"><h3>💰 Cộng / trừ số dư</h3><input id="uid" placeholder="User ID"><input id="amount" type="number" placeholder="+10000 hoặc -10000"><button onclick="balance()">CẬP NHẬT</button><pre id="balOut"></pre></div>
<div class="card"><h3>🔑 Tạo Key</h3><input id="hours" type="number" value="24"><input id="price" type="number" value="2000"><input id="limit" type="number" value="1"><button onclick="createKey()">TẠO KEY</button><pre id="keyOut"></pre></div>
<div class="card"><h3>📋 Keys</h3><button onclick="keys()">TẢI</button><pre id="keysOut"></pre></div>
<div class="card"><h3>💳 Giao dịch</h3><button onclick="transactions()">TẢI</button><pre id="txOut"></pre></div>
<div class="card"><h3>📊 Thống kê</h3><button onclick="stats()">TẢI</button><pre id="statsOut"></pre></div>
</div></section></main>
<script>
let token=localStorage.getItem("bon_admin_token")||"";const $=x=>document.getElementById(x);
async function api(u,o={}){let r=await fetch(u,{...o,headers:{"Content-Type":"application/json","Authorization":"Bearer "+token,...(o.headers||{})}});let d={};try{d=await r.json()}catch(_){}if(!r.ok)throw Error(d.message||"Lỗi");return d}
async function login(){try{let r=await fetch("/admin/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,password:$("pass").value})});let d=await r.json();if(!r.ok)throw Error(d.message);token=d.token;localStorage.setItem("bon_admin_token",token);$("login").classList.add("hide");$("panel").classList.remove("hide")}catch(e){$("msg").textContent=e.message}}
function logout(){localStorage.removeItem("bon_admin_token");token="";$("panel").classList.add("hide");$("login").classList.remove("hide")}
async function users(){try{$("usersOut").textContent=JSON.stringify(await api("/admin/api/users"),null,2)}catch(e){$("usersOut").textContent=e.message}}
async function balance(){try{$("balOut").textContent=JSON.stringify(await api("/admin/api/users/"+$("uid").value+"/balance",{method:"POST",body:JSON.stringify({amount:+$("amount").value})}),null,2)}catch(e){$("balOut").textContent=e.message}}
async function createKey(){try{$("keyOut").textContent=JSON.stringify(await api("/admin/api/keys",{method:"POST",body:JSON.stringify({duration_hours:+$("hours").value,price:+$("price").value,device_limit:+$("limit").value})}),null,2)}catch(e){$("keyOut").textContent=e.message}}
async function keys(){try{$("keysOut").textContent=JSON.stringify(await api("/admin/api/keys"),null,2)}catch(e){$("keysOut").textContent=e.message}}
async function transactions(){try{$("txOut").textContent=JSON.stringify(await api("/admin/api/transactions"),null,2)}catch(e){$("txOut").textContent=e.message}}
async function stats(){try{$("statsOut").textContent=JSON.stringify(await api("/admin/api/statistics"),null,2)}catch(e){$("statsOut").textContent=e.message}}
if(token){$("login").classList.add("hide");$("panel").classList.remove("hide")}
</script></body></html>
