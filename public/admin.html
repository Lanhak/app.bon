<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BON Admin</title>
<style>body{font-family:Arial;background:#070b16;color:#fff;padding:20px}.wrap{max-width:850px;margin:auto}.card{background:#0d1729;border:1px solid #263a5b;border-radius:16px;padding:20px;margin:12px 0}input,button{width:100%;padding:12px;margin:5px 0;border-radius:9px;border:1px solid #344d70;background:#091220;color:#fff}button{background:#285ee7;border:0;font-weight:700}pre{white-space:pre-wrap;background:#080e19;padding:12px;border-radius:10px;max-height:400px;overflow:auto}#panel{display:none}.top{display:flex;justify-content:space-between;align-items:center}.top button{width:auto}</style></head>
<body><div class="wrap">
<div id="login" class="card"><h2>🔐 BON ADMIN</h2><input id="email" type="email" placeholder="Admin Email"><input id="password" type="password" placeholder="Admin Password"><button onclick="login()">ĐĂNG NHẬP</button><pre id="msg"></pre></div>
<div id="panel"><div class="card top"><b>BON SERVER — ADMIN</b><button onclick="logout()">ĐĂNG XUẤT</button></div>
<div class="card"><h3>🔑 Tạo VIP Key</h3><input id="hours" type="number" value="24" placeholder="Số giờ"><input id="price" type="number" value="2000" placeholder="Giá"><input id="limit" type="number" value="1" placeholder="Thiết bị"><button onclick="createKey()">TẠO KEY</button><pre id="out"></pre></div>
<div class="card"><h3>📋 VIP Keys</h3><button onclick="loadKeys()">TẢI DANH SÁCH</button><pre id="keys"></pre></div></div></div>
<script>
let token=localStorage.getItem('bon_admin_token')||'';
async function login(){try{let r=await fetch('/admin/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});let d=await r.json();if(!r.ok||!d.success){msg.textContent=d.message||'Đăng nhập thất bại';return}token=d.token;localStorage.setItem('bon_admin_token',token);showPanel()}catch(e){msg.textContent='Không kết nối được server'}}
function showPanel(){login.style.display='none';panel.style.display='block'}
function logout(){localStorage.removeItem('bon_admin_token');token='';panel.style.display='none';login.style.display='block'}
async function api(u,o={}){let r=await fetch(u,{...o,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...(o.headers||{})}});if(r.status===401){logout();throw Error('Phiên hết hạn')}return r.json()}
async function createKey(){try{out.textContent=JSON.stringify(await api('/admin/api/keys',{method:'POST',body:JSON.stringify({duration_hours:+hours.value,price:+price.value,device_limit:+limit.value})}),null,2)}catch(e){out.textContent=e.message}}
async function loadKeys(){try{keys.textContent=JSON.stringify(await api('/admin/api/keys'),null,2)}catch(e){keys.textContent=e.message}}
if(token)showPanel();
</script></body></html>
